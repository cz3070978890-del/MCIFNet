name: Run HSI-MSI fusion example
on:
  push:
    branches:
      - codex/fusion-demo-run
  workflow_dispatch:

jobs:
  fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned open source example
        run: |
          git clone https://github.com/baosen-h/HyperspectralImageFusion.git demo
          cd demo
          git checkout da387ae15e6c4e0086119d4e10c5626c26a7517c
      - name: Install dependencies
        run: python -m pip install -r demo/requirements.txt
      - name: Run SFIM fusion on bundled Pavia University example
        run: |
          cd demo
          python hyperspectral_image_fusion.py --hsi DATA/INPUT/LR_HSI.mat --hsi-key data --msi DATA/INPUT/HR_MSI.mat --msi-key data --method sfim --mode 3
      - name: Calculate metrics against bundled reference
        run: |
          cd demo
          python - <<'PY'
          import csv
          import numpy as np
          from pathlib import Path
          from FUNCTION.common import imresize_cube, load_mat_array, to_hwc

          ref = to_hwc(load_mat_array(Path("DATA/REF.mat")))
          hs = to_hwc(load_mat_array(Path("DATA/INPUT/LR_HSI.mat"), "data"))
          ms = to_hwc(load_mat_array(Path("DATA/INPUT/HR_MSI.mat"), "data"))
          out = to_hwc(load_mat_array(Path("DATA/OUTPUT/LR_HSI_sfim.mat"), "data"))
          baseline = imresize_cube(hs, ref.shape[0], ref.shape[1], order=3)
          print(f"Input shapes: LR_HSI={hs.shape}, HR_MSI={ms.shape}, REF={ref.shape}")
          if ref.shape != out.shape or ref.shape != baseline.shape:
              raise ValueError("Reference, prediction, and baseline shapes must match")

          def scores(name, image):
              diff = ref - image
              mse = np.mean(diff ** 2)
              dot = np.sum(ref * image, axis=2)
              denom = np.linalg.norm(ref, axis=2) * np.linalg.norm(image, axis=2)
              cosine = np.clip(dot / np.maximum(denom, 1e-12), -1, 1)
              return {"method": name, "dataset": "Pavia University example",
                      "height": ref.shape[0], "width": ref.shape[1], "bands": ref.shape[2],
                      "RMSE": float(np.sqrt(mse)),
                      "PSNR": float(10 * np.log10(float(ref.max()) ** 2 / mse)),
                      "SAM_deg": float(np.rad2deg(np.mean(np.arccos(cosine)))),
                      "output_min": float(image.min()), "output_max": float(image.max())}

          rows = [scores("Bicubic upsampling", baseline), scores("SFIM mode 3", out)]
          with open("DATA/OUTPUT/metrics.csv", "w", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=rows[0].keys())
              writer.writeheader()
              writer.writerows(rows)
          for row in rows:
              print(row)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pavia-sfim-output
          path: |
            demo/DATA/OUTPUT/LR_HSI_sfim.mat
            demo/DATA/OUTPUT/metrics.csv
